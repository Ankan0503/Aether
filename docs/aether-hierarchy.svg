<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="980" viewBox="0 0 680 490" role="img">
<title>Aether system hierarchy</title>
<desc>Four-tier diagram: dashboard and backend above the Aether gateway, which meters incoming mains with a ZMPT voltage sensor and an ACS712 current sensor; below it an automation subnode with three sockets, a PIR and waveform load identification, and a kitchen safety subnode with gas and flame sensors linked directly to it by an offline trip path.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}
.t{font-size:14px;font-weight:400}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
rect{stroke-width:0.5}
</style>
</defs>

<rect x="0" y="0" width="680" height="490" fill="#ffffff"/>

<rect x="130" y="40" width="200" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="230" y="64" text-anchor="middle" class="th" fill="#3C3489">React dashboard</text>
<text x="230" y="82" text-anchor="middle" class="ts" fill="#534AB7">PWA, live and history</text>

<rect x="350" y="40" width="200" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="450" y="64" text-anchor="middle" class="th" fill="#3C3489">Django + TimescaleDB</text>
<text x="450" y="82" text-anchor="middle" class="ts" fill="#534AB7">Time-series rollups</text>

<line x1="230" y1="94" x2="295" y2="146" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="94" x2="385" y2="146" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="150" width="260" height="66" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="178" text-anchor="middle" class="th" fill="#085041">Aether gateway</text>
<text x="340" y="198" text-anchor="middle" class="ts" fill="#0F6E56">ZMPT + ACS712, true power</text>

<line x1="300" y1="216" x2="200" y2="266" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="216" x2="480" y2="266" class="arr" marker-end="url(#arrow)"/>

<rect x="60" y="270" width="250" height="70" rx="4" fill="#FAECE7" stroke="#993C1D"/>
<text x="185" y="294" text-anchor="middle" class="th" fill="#712B13">Automation subnode</text>
<text x="185" y="313" text-anchor="middle" class="ts" fill="#993C1D">3 sockets, PIR, load ID</text>
<text x="185" y="330" text-anchor="middle" class="ts" fill="#993C1D">cuts waste in empty rooms</text>

<rect x="370" y="270" width="250" height="70" rx="4" fill="#FAECE7" stroke="#993C1D"/>
<text x="495" y="294" text-anchor="middle" class="th" fill="#712B13">Kitchen safety subnode</text>
<text x="495" y="313" text-anchor="middle" class="ts" fill="#993C1D">Gas, flame, buzzer</text>
<text x="495" y="330" text-anchor="middle" class="ts" fill="#993C1D">trips relay without Wi-Fi</text>

<line x1="368" y1="305" x2="314" y2="305" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<line x1="185" y1="340" x2="185" y2="386" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="340" x2="495" y2="386" class="arr" marker-end="url(#arrow)"/>

<rect x="60" y="390" width="250" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="185" y="412" text-anchor="middle" class="t" fill="#444441">3 mains sockets</text>
<text x="185" y="430" text-anchor="middle" class="ts" fill="#5F5E5A">bulb, chargers, ACS712 x3</text>

<rect x="370" y="390" width="250" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="495" y="412" text-anchor="middle" class="t" fill="#444441">Kitchen sensors</text>
<text x="495" y="430" text-anchor="middle" class="ts" fill="#5F5E5A">MQ-2 gas, IR flame</text>

<line x1="60" y1="464" x2="90" y2="464" class="arr"/>
<text x="98" y="468" class="ts" fill="#5F5E5A">telemetry and commands</text>
<line x1="300" y1="464" x2="330" y2="464" class="arr" stroke-dasharray="4 3"/>
<text x="338" y="468" class="ts" fill="#5F5E5A">direct trip, works offline</text>
</svg>
